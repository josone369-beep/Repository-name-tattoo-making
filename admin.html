<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TATTOO MAKING - 관리자</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #ffffff;
            line-height: 1.6;
        }
        
        .header {
            background: rgba(10, 10, 10, 0.95);
            padding: 1.5rem 2rem;
            border-bottom: 2px solid #c9a45c;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .header h1 {
            font-size: 1.8rem;
            color: #c9a45c;
            letter-spacing: 3px;
        }
        
        .header p {
            color: #999;
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            background: rgba(18, 18, 18, 0.8);
            padding: 1rem;
            border-radius: 8px;
        }
        
        .tab {
            padding: 0.8rem 1.5rem;
            background: rgba(42, 42, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .tab:hover {
            background: rgba(201, 164, 92, 0.2);
            border-color: #c9a45c;
        }
        
        .tab.active {
            background: #c9a45c;
            color: #000;
            border-color: #c9a45c;
        }
        
        .tab-content {
            display: none;
            background: rgba(18, 18, 18, 0.9);
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #c9a45c;
            font-weight: 500;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            background: rgba(42, 42, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 5px;
            font-family: inherit;
            font-size: 0.95rem;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #c9a45c;
            background: rgba(42, 42, 42, 1);
        }
        
        .btn {
            padding: 1rem 2rem;
            background: #c9a45c;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        
        .btn:hover {
            background: #a88541;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(201, 164, 92, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #c9a45c;
        }
        
        .actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }
        
        .status {
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 1.5rem;
            display: none;
        }
        
        .status.success {
            background: rgba(39, 174, 96, 0.2);
            border: 1px solid #27ae60;
            color: #27ae60;
            display: block;
        }
        
        .status.error {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            color: #e74c3c;
            display: block;
        }
        
        .status.info {
            background: rgba(52, 152, 219, 0.2);
            border: 1px solid #3498db;
            color: #3498db;
            display: block;
        }
        
        .review-item {
            background: rgba(42, 42, 42, 0.6);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .review-item h3 {
            color: #c9a45c;
            margin-bottom: 1rem;
        }
        
        .price-item {
            background: rgba(42, 42, 42, 0.6);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .price-item h3 {
            color: #c9a45c;
            margin-bottom: 1rem;
        }
        
        .helper-text {
            font-size: 0.85rem;
            color: #999;
            margin-top: 0.3rem;
        }
        
        .section-title {
            font-size: 1.3rem;
            color: #c9a45c;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid rgba(201, 164, 92, 0.3);
        }
    </style>
</head>
<body>
    <div class="header">

                </div>

            <div class="review-item">

                </div>
                <div class="form-group">
                    <label>작업 유형</label>
                    <input type="text" id="review5Type" placeholder="팔뚝 타투">
                </div>
                <div class="form-group">

                </div>

            <div class="actions">

    <script>
        let siteData = {
            originalHTML: '',
            sha: ''
        };
        
        // 탭 전환
        function switchTab(event, tabName) {
            event.preventDefault();
            
            const tabs = document.querySelectorAll('.tab');
            const contents = document.querySelectorAll('.tab-content');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            contents.forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }
        
        // GitHub 설정 저장
        function saveConfig(event) {
            event.preventDefault();
            
            const config = {
                username: document.getElementById('githubUsername').value.trim(),
                repo: document.getElementById('githubRepo').value.trim(),
                token: document.getElementById('githubToken').value.trim()
            };
            
            if (!config.username || !config.repo || !config.token) {
                showStatus('모든 필드를 입력해주세요.', 'error');
                return;
            }
            
            localStorage.setItem('githubConfig', JSON.stringify(config));
            showStatus('✅ GitHub 설정이 저장되었습니다!', 'success');
        }
        
        // 사이트 데이터 불러오기
        async function loadSiteData() {
            const config = getConfig();
            if (!config) return;
            
            showStatus('📥 사이트 데이터를 불러오는 중...', 'info');
            
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${config.username}/${config.repo}/contents/index.html`,
                    {
                        headers: {
                            'Authorization': `token ${config.token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    }
                );
                
                if (!response.ok) {
                    throw new Error(`GitHub API 오류: ${response.status}`);
                }
                
                const data = await response.json();
                siteData.sha = data.sha;
                siteData.originalHTML = decodeURIComponent(escape(atob(data.content)));
                
                // 데이터 추출
                extractData(siteData.originalHTML);
                
                showStatus('✅ 사이트 데이터를 성공적으로 불러왔습니다!', 'success');
            } catch (error) {
                console.error('Error:', error);
                showStatus(`❌ 오류: ${error.message}`, 'error');
            }
        }
        
        // 데이터 추출
        function extractData(html) {
            // 연락처 추출
            const phoneMatch = html.match(/010-\d{4}-\d{4}/);
            if (phoneMatch) {
                document.getElementById('phone').value = phoneMatch[0];
                document.getElementById('currentPhone').textContent = phoneMatch[0];
            }
            
            const kakaoMatch = html.match(/ID:\s*making\d+/);
            if (kakaoMatch) {
                const kakaoId = kakaoMatch[0].replace('ID:', '').trim();
                document.getElementById('kakaoId').value = kakaoId;
                document.getElementById('currentKakao').textContent = kakaoId;
            }
            
            const instagramMatch = html.match(/@tattoo_making/);
            if (instagramMatch) {
                document.getElementById('instagramId').value = 'tattoo_making';
                document.getElementById('currentInstagram').textContent = '@tattoo_making';
            }
            
            const linktreeMatch = html.match(/linktr\.ee\/tattoo_making/);
            if (linktreeMatch) {
                document.getElementById('linktreeUrl').value = linktreeMatch[0];
                document.getElementById('currentLinktree').textContent = linktreeMatch[0];
            }
            
            // 가격 추출
            const priceMatches = [];
            const pricePattern = /<div class="pricing-card[^>]*>[\s\S]*?<h3>(.*?)<\/h3>[\s\S]*?<p class="pricing-size">(.*?)<\/p>[\s\S]*?<span class="price-amount">(.*?)<\/span>/g;
            let match;
            while ((match = pricePattern.exec(html)) !== null) {
                priceMatches.push({ title: match[1], size: match[2], amount: match[3] });
            }
            
            if (priceMatches.length >= 4) {
                document.getElementById('price1Size').value = priceMatches[0].size;
                document.getElementById('price1Amount').value = priceMatches[0].amount;
                document.getElementById('price2Size').value = priceMatches[1].size;
                document.getElementById('price2Amount').value = priceMatches[1].amount;
                document.getElementById('price3Size').value = priceMatches[2].size;
                document.getElementById('price3Amount').value = priceMatches[2].amount;
                document.getElementById('price4Size').value = priceMatches[3].size;
                document.getElementById('price4Amount').value = priceMatches[3].amount;
            }
            
            // 후기 추출 (6개)
            const reviewPattern = /<div class="review-card">[\s\S]*?<p class="review-text">\s*(.*?)\s*<\/p>[\s\S]*?<p class="author-name">(.*?)<\/p>[\s\S]*?<p class="review-type">(.*?)<\/p>[\s\S]*?<\/div>\s*<\/div>\s*<\/div>/g;
            const reviews = [];
            while ((match = reviewPattern.exec(html)) !== null) {
                reviews.push({
                    text: match[1].replace(/\s+/g, ' ').trim(),
                    name: match[2].trim(),
                    type: match[3].trim()
                });
            }
            
            reviews.forEach((review, idx) => {
                if (idx < 6) {
                    document.getElementById(`review${idx}Name`).value = review.name;
                    document.getElementById(`review${idx}Type`).value = review.type;
                    document.getElementById(`review${idx}Text`).value = review.text.replace(/"/g, '');
                }
            });
        }
        
        // 저장 및 배포
        async function deployAll() {
            const config = getConfig();
            if (!config) return;
            
            if (!siteData.originalHTML || !siteData.sha) {
                showStatus('❌ 먼저 "사이트 데이터 불러오기"를 클릭하세요!', 'error');
                return;
            }
            
            if (!confirm('변경사항을 저장하고 사이트에 배포하시겠습니까?')) {
                return;
            }
            
            showStatus('🚀 배포 중...', 'info');
            
            try {
                let html = siteData.originalHTML;
                
                // 전화번호 업데이트
                const phone = document.getElementById('phone').value;
                if (phone) {
                    html = html.replace(/010-\d{4}-\d{4}/g, phone);
                }
                
                // 카카오톡 ID 업데이트
                const kakaoId = document.getElementById('kakaoId').value;
                if (kakaoId) {
                    html = html.replace(/(ID:\s*)making\d+/g, `$1${kakaoId}`);
                }
                
                // 인스타그램 업데이트
                const instagramId = document.getElementById('instagramId').value;
                if (instagramId) {
                    html = html.replace(/@tattoo_making/g, `@${instagramId}`);
                    html = html.replace(/tattoo_making/g, instagramId);
                }
                
                // Linktree 업데이트
                const linktreeUrl = document.getElementById('linktreeUrl').value;
                if (linktreeUrl) {
                    html = html.replace(/linktr\.ee\/tattoo_making/g, linktreeUrl);
                }
                
                // 가격 업데이트 (4단계)
                for (let i = 1; i <= 4; i++) {
                    const size = document.getElementById(`price${i}Size`).value;
                    const amount = document.getElementById(`price${i}Amount`).value;
                    
                    if (size && amount) {
                        // 가격 카드별로 업데이트 - 순서대로 찾아서 교체
                        const priceCardPattern = /(<div class="pricing-card[^>]*>[\s\S]*?<p class="pricing-size">)(.*?)(<\/p>[\s\S]*?<span class="price-amount">)(.*?)(<\/span>)/;
                        
                        // i번째 카드 찾기
                        let count = 0;
                        html = html.replace(priceCardPattern, function(match, p1, oldSize, p3, oldAmount, p5) {
                            count++;
                            if (count === i) {
                                return p1 + size + p3 + amount + p5;
                            }
                            return match;
                        });
                    }
                }
                
                // 후기 업데이트 (6개)
                for (let i = 0; i < 6; i++) {
                    const name = document.getElementById(`review${i}Name`).value;
                    const type = document.getElementById(`review${i}Type`).value;
                    const text = document.getElementById(`review${i}Text`).value;
                    
                    if (name && type && text) {
                        // i번째 후기 카드 찾아서 업데이트
                        const reviewPattern = /(<div class="review-card">[\s\S]*?<p class="review-text">\s*).*?(\s*<\/p>[\s\S]*?<p class="author-name">).*?(<\/p>[\s\S]*?<p class="review-type">).*?(<\/p>[\s\S]*?<\/div>\s*<\/div>\s*<\/div>)/;
                        
                        let count = 0;
                        html = html.replace(new RegExp(reviewPattern.source, 'g'), function(match, p1, p2, p3, p4) {
                            if (count === i) {
                                count++;
                                return p1 + '"' + text + '"' + p2 + name + p3 + type + p4;
                            }
                            count++;
                            return match;
                        });
                    }
                }
                
                // UTF-8 안전 인코딩
                const encodedContent = btoa(unescape(encodeURIComponent(html)));
                
                // GitHub에 커밋
                const response = await fetch(
                    `https://api.github.com/repos/${config.username}/${config.repo}/contents/index.html`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${config.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: '[CMS] 콘텐츠 업데이트',
                            content: encodedContent,
                            sha: siteData.sha
                        })
                    }
                );
                
                if (!response.ok) {
                    throw new Error(`배포 실패: ${response.status}`);
                }
                
                const result = await response.json();
                siteData.sha = result.content.sha;
                
                showStatus('✅ 성공적으로 배포되었습니다! 1-2분 후 사이트에서 확인하세요.', 'success');
            } catch (error) {
                console.error('Error:', error);
                showStatus(`❌ 배포 오류: ${error.message}`, 'error');
            }
        }
        
        // 유틸리티 함수
        function getConfig() {
            const configStr = localStorage.getItem('githubConfig');
            if (!configStr) {
                showStatus('❌ GitHub 설정을 먼저 저장해주세요!', 'error');
                return null;
            }
            return JSON.parse(configStr);
        }
        
        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            
            setTimeout(() => {
                statusEl.className = 'status';
            }, 5000);
        }
        
        // 페이지 로드 시 저장된 설정 불러오기
        window.addEventListener('load', function() {
            const config = JSON.parse(localStorage.getItem('githubConfig') || '{}');
            if (config.username) document.getElementById('githubUsername').value = config.username;
            if (config.repo) document.getElementById('githubRepo').value = config.repo;
            if (config.token) document.getElementById('githubToken').value = config.token;
        });
    </script>
</body>
</html>
