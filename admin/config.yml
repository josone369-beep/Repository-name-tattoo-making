backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: ko

collections:
  - name: portfolio
    label: "포트폴리오"
    folder: "content/portfolio"
    create: true
    fields:
      - {label: "제목", name: "title", widget: "string"}
      - {label: "카테고리", name: "category", widget: "select", options: ["이레즈미", "블랙워크", "리얼리즘", "폴리네시안"]}
      - {label: "이미지", name: "image", widget: "image"}
      - {label: "설명", name: "description", widget: "text"}
      - {label: "게시일", name: "date", widget: "datetime"}
      - {label: "노출", name: "published", widget: "boolean", default: true}

  - name: reviews
    label: "고객 후기"
    folder: "content/reviews"
    create: true
    fields:
      - {label: "고객명", name: "name", widget: "string"}
      - {label: "별점", name: "rating", widget: "number", default: 5}
      - {label: "후기", name: "content", widget: "text"}
      - {label: "게시일", name: "date", widget: "datetime"}
      - {label: "노출", name: "published", widget: "boolean", default: true}

  - name: pricing
    label: "가격표"
    folder: "content/pricing"
    create: true
    fields:
      - {label: "서비스명", name: "title", widget: "string"}
      - {label: "가격", name: "price", widget: "string"}
      - {label: "설명", name: "description", widget: "text"}
      - {label: "노출", name: "published", widget: "boolean", default: true}
