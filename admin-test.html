<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TATTOO MAKING CMS - 테스트</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #fff;
            padding: 2rem;
        }
        .container { max-width: 800px; margin: 0 auto; background: rgba(18, 18, 18, 0.9); padding: 2rem; border-radius: 8px; }
        h1 { color: #c9a45c; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: #c9a45c; font-weight: 500; }
        input, textarea {
            width: 100%;
            padding: 0.8rem;
            background: rgba(42, 42, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 5px;
            font-family: inherit;
        }
        textarea { min-height: 100px; resize: vertical; }
        .btn {
            padding: 1rem 2rem;
            background: #c9a45c;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 1rem;
        }
        .btn:hover { background: #a88541; }
        .result {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(52, 152, 219, 0.2);
            border: 1px solid #3498db;
            border-radius: 5px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .review-box {
            background: rgba(42, 42, 42, 0.6);
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .review-box h3 { color: #c9a45c; margin-bottom: 0.5rem; }
        .review-box p { color: #ccc; margin-bottom: 0.3rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖤 TATTOO MAKING CMS 테스트</h1>
        
        <div class="form-group">
            <label>GitHub 사용자명</label>
            <input type="text" id="username" value="josone369-beep">
        </div>
        
        <div class="form-group">
            <label>저장소 이름</label>
            <input type="text" id="repo" value="Repository-name-tattoo-making">
        </div>
        
        <div class="form-group">
            <label>Personal Access Token</label>
            <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxx">
        </div>
        
        <button class="btn" onclick="testLoad()">🔍 테스트: 데이터 불러오기</button>
        
        <div id="result" class="result" style="display: none;"></div>
        
        <div id="reviews" style="margin-top: 2rem;"></div>
    </div>
    
    <script>
        async function testLoad() {
            const username = document.getElementById('username').value.trim();
            const repo = document.getElementById('repo').value.trim();
            const token = document.getElementById('token').value.trim();
            
            if (!username || !repo || !token) {
                alert('모든 필드를 입력해주세요!');
                return;
            }
            
            const resultDiv = document.getElementById('result');
            const reviewsDiv = document.getElementById('reviews');
            resultDiv.style.display = 'block';
            resultDiv.textContent = '📥 데이터 불러오는 중...\n';
            
            try {
                // GitHub에서 index.html 가져오기
                const response = await fetch(
                    `https://api.github.com/repos/${username}/${repo}/contents/index.html`,
                    {
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    }
                );
                
                if (!response.ok) {
                    throw new Error(`GitHub API 오류: ${response.status}`);
                }
                
                const data = await response.json();
                const html = decodeURIComponent(escape(atob(data.content)));
                
                resultDiv.textContent += `✅ HTML 다운로드 완료 (${html.length} 문자)\n\n`;
                
                // 후기 추출 테스트
                resultDiv.textContent += '=== 후기 추출 테스트 ===\n\n';
                
                // 패턴 1: 기본 패턴
                const pattern1 = /<p class="review-text">\s+(.*?)\s+<\/p>[\s\S]*?<p class="author-name">(.*?)<\/p>[\s\S]*?<p class="review-type">(.*?)<\/p>/g;
                let matches1 = [...html.matchAll(pattern1)];
                resultDiv.textContent += `패턴 1 결과: ${matches1.length}개 발견\n`;
                
                // 패턴 2: 더 유연한 패턴
                const pattern2 = /<p class="review-text">[\s\S]*?"(.*?)"[\s\S]*?<\/p>[\s\S]*?<p class="author-name">(.*?)<\/p>[\s\S]*?<p class="review-type">(.*?)<\/p>/g;
                let matches2 = [...html.matchAll(pattern2)];
                resultDiv.textContent += `패턴 2 결과: ${matches2.length}개 발견\n`;
                
                // 패턴 3: 가장 단순한 패턴
                const pattern3 = /<div class="review-card">/g;
                let matches3 = [...html.matchAll(pattern3)];
                resultDiv.textContent += `패턴 3 결과: ${matches3.length}개 review-card 발견\n\n`;
                
                // 실제 후기 추출 (패턴 2 사용)
                const reviews = [];
                for (let match of matches2) {
                    let text = match[1]
                        .replace(/\s+/g, ' ')
                        .trim();
                    const name = match[2].trim();
                    const type = match[3].trim();
                    
                    reviews.push({ text, name, type });
                    
                    resultDiv.textContent += `후기 ${reviews.length}:\n`;
                    resultDiv.textContent += `  이름: ${name}\n`;
                    resultDiv.textContent += `  유형: ${type}\n`;
                    resultDiv.textContent += `  내용: ${text.substring(0, 50)}...\n\n`;
                }
                
                // 후기 표시
                reviewsDiv.innerHTML = '<h2 style="color: #c9a45c; margin-bottom: 1rem;">추출된 후기:</h2>';
                
                if (reviews.length === 0) {
                    reviewsDiv.innerHTML += '<p style="color: #e74c3c;">❌ 후기를 찾을 수 없습니다!</p>';
                    
                    // HTML 일부 보여주기
                    const reviewSection = html.match(/<!-- Reviews Section -->[\s\S]{0,2000}/);
                    if (reviewSection) {
                        resultDiv.textContent += '\n=== HTML 샘플 (Reviews Section) ===\n';
                        resultDiv.textContent += reviewSection[0].substring(0, 500) + '...\n';
                    }
                } else {
                    reviews.forEach((review, idx) => {
                        reviewsDiv.innerHTML += `
                            <div class="review-box">
                                <h3>후기 ${idx + 1}</h3>
                                <p><strong>이름:</strong> ${review.name}</p>
                                <p><strong>유형:</strong> ${review.type}</p>
                                <p><strong>내용:</strong> ${review.text}</p>
                            </div>
                        `;
                    });
                    
                    resultDiv.textContent += `\n✅ 총 ${reviews.length}개 후기 추출 완료!\n`;
                    alert(`✅ 성공! ${reviews.length}개 후기를 찾았습니다!`);
                }
                
            } catch (error) {
                resultDiv.textContent += `\n❌ 오류 발생: ${error.message}\n`;
                alert(`오류: ${error.message}`);
            }
        }
    </script>
</body>
</html>
