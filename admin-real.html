<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TATTOO MAKING CMS - 실제 작동 버전</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #fff;
            line-height: 1.6;
        }
        .header {
            background: rgba(10, 10, 10, 0.95);
            padding: 1.5rem 2rem;
            border-bottom: 2px solid #c9a45c;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header h1 { font-size: 1.8rem; color: #c9a45c; letter-spacing: 3px; }
        .header p { color: #999; font-size: 0.9rem; margin-top: 0.3rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            background: rgba(18, 18, 18, 0.8);
            padding: 1rem;
            border-radius: 8px;
        }
        .tab {
            padding: 0.8rem 1.5rem;
            background: rgba(42, 42, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
            font-weight: 500;
        }
        .tab:hover { background: rgba(201, 164, 92, 0.2); border-color: #c9a45c; }
        .tab.active { background: #c9a45c; color: #000; }
        
        .tab-content { 
            display: none; 
            background: rgba(18, 18, 18, 0.9); 
            padding: 2rem; 
            border-radius: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #c9a45c; font-weight: 500; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            background: rgba(42, 42, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 5px;
            font-family: inherit;
            font-size: 0.95rem;
        }
        .form-group textarea { resize: vertical; min-height: 120px; }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #c9a45c;
            background: rgba(42, 42, 42, 1);
        }
        
        .btn {
            padding: 1rem 2rem;
            background: #c9a45c;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        .btn:hover { 
            background: #a88541; 
            transform: translateY(-2px); 
            box-shadow: 0 4px 16px rgba(201, 164, 92, 0.4); 
        }
        .btn-secondary { 
            background: rgba(255, 255, 255, 0.1); 
            color: #fff; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
        }
        .btn-secondary:hover { 
            background: rgba(255, 255, 255, 0.2); 
            border-color: #c9a45c; 
        }
        
        .actions { display: flex; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; }
        
        .status { padding: 1rem; border-radius: 5px; margin-bottom: 1.5rem; display: none; }
        .status.success { background: rgba(39, 174, 96, 0.2); border: 1px solid #27ae60; color: #27ae60; display: block; }
        .status.error { background: rgba(231, 76, 60, 0.2); border: 1px solid #e74c3c; color: #e74c3c; display: block; }
        .status.info { background: rgba(52, 152, 219, 0.2); border: 1px solid #3498db; color: #3498db; display: block; }
        
        .review-item, .price-item { 
            background: rgba(42, 42, 42, 0.6); 
            padding: 1.5rem; 
            border-radius: 8px; 
            margin-bottom: 1.5rem; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .review-item h3, .price-item h3 { color: #c9a45c; margin-bottom: 1rem; }
        
        .helper-text { font-size: 0.85rem; color: #999; margin-top: 0.3rem; }
        .section-title { 
            font-size: 1.3rem; 
            color: #c9a45c; 
            margin-bottom: 1.5rem; 
            padding-bottom: 0.5rem; 
            border-bottom: 2px solid rgba(201, 164, 92, 0.3); 
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🖤 TATTOO MAKING CMS</h1>
        <p>실제 GitHub Pages HTML 구조 기반</p>
    </div>
    
    <div class="container">
        <div id="statusMessage" class="status"></div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab(event, 'setup')">⚙️ GitHub 설정</button>
            <button class="tab" onclick="switchTab(event, 'contact')">📞 연락처</button>
            <button class="tab" onclick="switchTab(event, 'review')">⭐ 후기 (6개)</button>
        </div>
        
        <!-- GitHub 설정 -->
        <div id="setup" class="tab-content active">
            <h2 class="section-title">GitHub 저장소 설정</h2>
            <form id="configForm" onsubmit="saveConfig(event)">
                <div class="form-group">
                    <label>GitHub 사용자명</label>
                    <input type="text" id="githubUsername" placeholder="josone369-beep" required>
                </div>
                <div class="form-group">
                    <label>저장소 이름</label>
                    <input type="text" id="githubRepo" placeholder="Repository-name-tattoo-making" required>
                </div>
                <div class="form-group">
                    <label>Personal Access Token</label>
                    <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxxx" required>
                </div>
                <div class="actions">
                    <button type="submit" class="btn">설정 저장</button>
                    <button type="button" class="btn btn-secondary" onclick="loadRealData()">📥 실제 사이트 데이터 불러오기</button>
                </div>
            </form>
        </div>
        
        <!-- 연락처 -->
        <div id="contact" class="tab-content">
            <h2 class="section-title">연락처 정보</h2>
            <div class="form-group">
                <label>전화번호</label>
                <input type="tel" id="phone" placeholder="010-2254-0690">
                <p class="helper-text">현재: <span id="currentPhone">-</span></p>
            </div>
            <div class="form-group">
                <label>카카오톡 ID</label>
                <input type="text" id="kakaoId" placeholder="making91">
                <p class="helper-text">현재: <span id="currentKakao">-</span></p>
            </div>
            <div class="actions">
                <button type="button" class="btn" onclick="alert('준비 중입니다')">💾 저장 및 배포</button>
            </div>
        </div>
        
        <!-- 후기 -->
        <div id="review" class="tab-content">
            <h2 class="section-title">고객 후기 (6개)</h2>
            
            <div class="review-item">
                <h3>후기 1</h3>
                <div class="form-group">
                    <label>고객 이름</label>
                    <input type="text" id="review0Name">
                </div>
                <div class="form-group">
                    <label>작업 유형</label>
                    <input type="text" id="review0Type">
                </div>
                <div class="form-group">
                    <label>후기 내용</label>
                    <textarea id="review0Text"></textarea>
                </div>
            </div>
            
            <div class="review-item">
                <h3>후기 2</h3>
                <div class="form-group">
                    <label>고객 이름</label>
                    <input type="text" id="review1Name">
                </div>
                <div class="form-group">
                    <label>작업 유형</label>
                    <input type="text" id="review1Type">
                </div>
                <div class="form-group">
                    <label>후기 내용</label>
                    <textarea id="review1Text"></textarea>
                </div>
            </div>
            
            <div class="review-item">
                <h3>후기 3</h3>
                <div class="form-group">
                    <label>고객 이름</label>
                    <input type="text" id="review2Name">
                </div>
                <div class="form-group">
                    <label>작업 유형</label>
                    <input type="text" id="review2Type">
                </div>
                <div class="form-group">
                    <label>후기 내용</label>
                    <textarea id="review2Text"></textarea>
                </div>
            </div>
            
            <div class="review-item">
                <h3>후기 4</h3>
                <div class="form-group">
                    <label>고객 이름</label>
                    <input type="text" id="review3Name">
                </div>
                <div class="form-group">
                    <label>작업 유형</label>
                    <input type="text" id="review3Type">
                </div>
                <div class="form-group">
                    <label>후기 내용</label>
                    <textarea id="review3Text"></textarea>
                </div>
            </div>
            
            <div class="review-item">
                <h3>후기 5</h3>
                <div class="form-group">
                    <label>고객 이름</label>
                    <input type="text" id="review4Name">
                </div>
                <div class="form-group">
                    <label>작업 유형</label>
                    <input type="text" id="review4Type">
                </div>
                <div class="form-group">
                    <label>후기 내용</label>
                    <textarea id="review4Text"></textarea>
                </div>
            </div>
            
            <div class="review-item">
                <h3>후기 6</h3>
                <div class="form-group">
                    <label>고객 이름</label>
                    <input type="text" id="review5Name">
                </div>
                <div class="form-group">
                    <label>작업 유형</label>
                    <input type="text" id="review5Type">
                </div>
                <div class="form-group">
                    <label>후기 내용</label>
                    <textarea id="review5Text"></textarea>
                </div>
            </div>
            
            <div class="actions">
                <button type="button" class="btn" onclick="alert('준비 중입니다')">💾 저장 및 배포</button>
            </div>
        </div>
    </div>
    
    <script>
        let siteData = { originalHTML: '', sha: '' };
        
        function switchTab(event, tabName) {
            event.preventDefault();
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }
        
        function saveConfig(event) {
            event.preventDefault();
            const config = {
                username: document.getElementById('githubUsername').value.trim(),
                repo: document.getElementById('githubRepo').value.trim(),
                token: document.getElementById('githubToken').value.trim()
            };
            if (!config.username || !config.repo || !config.token) {
                showStatus('모든 필드를 입력해주세요.', 'error');
                return;
            }
            localStorage.setItem('githubConfig', JSON.stringify(config));
            showStatus('✅ GitHub 설정이 저장되었습니다!', 'success');
        }
        
        async function loadRealData() {
            const config = getConfig();
            if (!config) return;
            
            showStatus('📥 실제 사이트 데이터 불러오는 중...', 'info');
            
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${config.username}/${config.repo}/contents/index.html`,
                    { headers: { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github.v3+json' } }
                );
                
                if (!response.ok) throw new Error(`GitHub API 오류: ${response.status}`);
                
                const data = await response.json();
                siteData.sha = data.sha;
                siteData.originalHTML = decodeURIComponent(escape(atob(data.content)));
                
                console.log('✅ HTML 로드 완료:', siteData.originalHTML.length, '문자');
                
                // 실제 패턴으로 추출
                extractRealData(siteData.originalHTML);
                
                showStatus('✅ 사이트 데이터를 성공적으로 불러왔습니다! 후기 탭을 확인하세요.', 'success');
            } catch (error) {
                console.error('Error:', error);
                showStatus(`❌ 오류: ${error.message}`, 'error');
            }
        }
        
        function extractRealData(html) {
            console.log('=== 실제 데이터 추출 시작 ===');
            
            // 연락처 - 간단한 패턴
            const phoneMatch = html.match(/010-?\d{4}-?\d{4}/);
            if (phoneMatch) {
                document.getElementById('phone').value = phoneMatch[0];
                document.getElementById('currentPhone').textContent = phoneMatch[0];
                console.log('✅ 전화:', phoneMatch[0]);
            }
            
            // 카카오 - 간단한 패턴
            const kakaoMatches = html.match(/making\d+/g);
            if (kakaoMatches && kakaoMatches.length > 0) {
                document.getElementById('kakaoId').value = kakaoMatches[0];
                document.getElementById('currentKakao').textContent = kakaoMatches[0];
                console.log('✅ 카카오:', kakaoMatches[0]);
            }
            
            // 후기 추출 - 김** 님 기준으로 찾기
            console.log('=== 후기 추출 시작 ===');
            
            const reviewNames = ['김** 님', '박** 님', '이** 님', '최** 님', '정** 님', '강** 님'];
            let foundCount = 0;
            
            reviewNames.forEach((name, idx) => {
                const nameIndex = html.indexOf(name);
                if (nameIndex !== -1) {
                    // 이름 앞뒤 500자 추출
                    const start = Math.max(0, nameIndex - 300);
                    const end = Math.min(html.length, nameIndex + 300);
                    const context = html.substring(start, end);
                    
                    console.log(`후기 ${idx + 1} (${name}) 발견:`, nameIndex);
                    
                    // 이름 채우기
                    document.getElementById(`review${idx}Name`).value = name;
                    
                    // 작업 유형 찾기 (이름 뒤 100자 내)
                    const typeContext = html.substring(nameIndex, nameIndex + 100);
                    const typePatterns = [
                        /등판 이레즈미/,
                        /풀슬리브/,
                        /리얼리즘 초상화/,
                        /커버업 작업/,
                        /가슴 사무라이/,
                        /팔뚝 타투/
                    ];
                    
                    for (let pattern of typePatterns) {
                        const match = typeContext.match(pattern);
                        if (match) {
                            document.getElementById(`review${idx}Type`).value = match[0];
                            console.log(`  작업 유형: ${match[0]}`);
                            break;
                        }
                    }
                    
                    // 후기 텍스트 찾기 (이름 앞 300자 내)
                    const textContext = html.substring(Math.max(0, nameIndex - 300), nameIndex);
                    
                    // 따옴표로 묶인 텍스트 찾기
                    const textMatches = textContext.match(/"([^"]{20,})"/g);
                    if (textMatches && textMatches.length > 0) {
                        let text = textMatches[textMatches.length - 1]
                            .replace(/"/g, '')
                            .replace(/\s+/g, ' ')
                            .trim();
                        document.getElementById(`review${idx}Text`).value = text;
                        console.log(`  내용: ${text.substring(0, 50)}...`);
                    }
                    
                    foundCount++;
                }
            });
            
            console.log(`✅ 총 ${foundCount}개 후기 추출 완료!`);
            
            if (foundCount === 0) {
                console.error('❌ 후기를 찾을 수 없습니다!');
                alert('후기를 찾을 수 없습니다. 브라우저 콘솔(F12)을 확인하세요.');
            } else {
                alert(`✅ ${foundCount}개 후기를 찾았습니다! 후기 탭을 확인하세요.`);
            }
        }
        
        function getConfig() {
            const configStr = localStorage.getItem('githubConfig');
            if (!configStr) {
                showStatus('❌ GitHub 설정을 먼저 저장해주세요!', 'error');
                return null;
            }
            return JSON.parse(configStr);
        }
        
        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            if (type !== 'info') setTimeout(() => statusEl.className = 'status', 5000);
        }
        
        window.addEventListener('load', function() {
            const config = JSON.parse(localStorage.getItem('githubConfig') || '{}');
            if (config.username) document.getElementById('githubUsername').value = config.username;
            if (config.repo) document.getElementById('githubRepo').value = config.repo;
            if (config.token) document.getElementById('githubToken').value = config.token;
        });
    </script>
</body>
</html>
