<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TATTOO MAKING - 관리자 CMS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #ffffff;
            line-height: 1.6;
        }
        
        .header {
            background: rgba(10, 10, 10, 0.95);
            padding: 1.5rem 2rem;
            border-bottom: 2px solid #c9a45c;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .header h1 {
            font-size: 1.8rem;
            color: #c9a45c;
            letter-spacing: 3px;
        }
        
        .header p {
            color: #999;
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            background: rgba(18, 18, 18, 0.8);
            padding: 1rem;
            border-radius: 8px;
        }
        
        .tab {
            padding: 0.8rem 1.5rem;
            background: rgba(42, 42, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .tab:hover {
            background: rgba(201, 164, 92, 0.2);
            border-color: #c9a45c;
        }
        
        .tab.active {
            background: #c9a45c;
            color: #000;
            border-color: #c9a45c;
        }
        
        .tab-content {
            display: none;
            background: rgba(18, 18, 18, 0.9);
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #c9a45c;
            font-weight: 500;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            background: rgba(42, 42, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 5px;
            font-family: inherit;
            font-size: 0.95rem;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #c9a45c;
            background: rgba(42, 42, 42, 1);
        }
        
        .btn {
            padding: 1rem 2rem;
            background: #c9a45c;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        
        .btn:hover {
            background: #a88541;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(201, 164, 92, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #c9a45c;
        }
        
        .actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }
        
        .status {
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 1.5rem;
            display: none;
        }
        
        .status.success {
            background: rgba(39, 174, 96, 0.2);
            border: 1px solid #27ae60;
            color: #27ae60;
            display: block;
        }
        
        .status.error {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            color: #e74c3c;
            display: block;
        }
        
        .status.info {
            background: rgba(52, 152, 219, 0.2);
            border: 1px solid #3498db;
            color: #3498db;
            display: block;
        }
        
        .review-item, .price-item {
            background: rgba(42, 42, 42, 0.6);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .review-item h3, .price-item h3 {
            color: #c9a45c;
            margin-bottom: 1rem;
        }
        
        .helper-text {
            font-size: 0.85rem;
            color: #999;
            margin-top: 0.3rem;
        }
        
        .section-title {
            font-size: 1.3rem;
            color: #c9a45c;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid rgba(201, 164, 92, 0.3);
        }
        
        .drop-zone {
            border: 2px dashed rgba(201, 164, 92, 0.5);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(42, 42, 42, 0.4);
        }
        
        .drop-zone:hover {
            border-color: #c9a45c;
            background: rgba(201, 164, 92, 0.1);
        }
        
        .drop-zone.dragover {
            border-color: #c9a45c;
            background: rgba(201, 164, 92, 0.2);
        }
        
        .image-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .preview-item {
            position: relative;
            border-radius: 5px;
            overflow: hidden;
            aspect-ratio: 1;
        }
        
        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .preview-item .delete-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(231, 76, 60, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🖤 TATTOO MAKING 관리자 CMS</h1>
        <p>부산 블랙&그레이 리얼리즘 전문 타투샵 - 완전 관리 시스템</p>
    </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab(event, 'setup')">⚙️ GitHub 설정</button>
            <button class="tab" onclick="switchTab(event, 'images')">🖼️ 이미지</button>

        <!-- GitHub 설정 탭 -->
        <div id="setup" class="tab-content active">

            <form id="configForm" onsubmit="saveConfig(event)">

        <!-- 이미지 탭 -->

            <div class="form-group">

                <div class="drop-zone" id="portfolioDropZone">

            <div class="form-group">

                    <input type="file" id="designsInput" accept="image/*" multiple style="display: none;">

        <!-- 연락처 탭 -->

            <h2 class="section-title">연락처 정보</h2>

                <div class="form-group">

                    <input type="text" id="instagramId" placeholder="tattoo_making">

                <div class="form-group">

                    <p class="helper-text">현재: <span id="currentLinktree">-</span></p>

                <div class="actions">

                </div>
            </form>
        </div>
        
        <!-- 가격 탭 -->
        <div id="price" class="tab-content">
            <h2 class="section-title">가격 정보 (4단계)</h2>
            
            <div class="price-item">
                <h3>1단계: 미니 타투</h3>

                <div class="form-group">
                    <label>가격</label>
                    <input type="text" id="price1Amount" placeholder="100,000원">

            <div class="price-item">
                <h3>2단계: 스몰 사이즈</h3>
                <div class="form-group">
                    <label>사이즈 설명</label>

                <div class="form-group">

            <div class="price-item">

                <div class="form-group">
                    <label>사이즈 설명</label>

                <div class="form-group">

                </div>
            </div>
            
            <div class="price-item">
                <h3>4단계: 대형 작업</h3>
                <div class="form-group">
                    <label>사이즈 설명</label>

            <div class="actions">
                <button type="button" class="btn" onclick="deployAll()">💾 저장 및 배포</button>

        <!-- 후기 탭 -->
        <div id="review" class="tab-content">
            <h2 class="section-title">고객 후기 (6개)</h2>
            
            <div class="review-item">

                <div class="form-group">
                    <label>작업 유형</label>
                    <input type="text" id="review0Type" placeholder="등판 이레즈미">
                </div>
                <div class="form-group">
                    <label>후기 내용</label>
                    <textarea id="review0Text" placeholder="후기 내용을 입력하세요"></textarea>
                </div>

            <div class="review-item">
                <h3>후기 2</h3>
                <div class="form-group">

                <div class="form-group">

                    <input type="text" id="review1Type" placeholder="풀슬리브">
                </div>
                <div class="form-group">
                    <label>후기 내용</label>
                    <textarea id="review1Text" placeholder="후기 내용을 입력하세요"></textarea>
                </div>
            </div>
            
            <div class="review-item">
                <h3>후기 3</h3>
                <div class="form-group">
                    <label>고객 이름</label>
                    <input type="text" id="review2Name" placeholder="이** 님">
                </div>
                <div class="form-group">
                    <label>작업 유형</label>
                    <input type="text" id="review2Type" placeholder="리얼리즘 초상화">
                </div>
                <div class="form-group">
                    <label>후기 내용</label>
                    <textarea id="review2Text" placeholder="후기 내용을 입력하세요"></textarea>
                </div>
            </div>
            
            <div class="review-item">
                <h3>후기 4</h3>
                <div class="form-group">
                    <label>고객 이름</label>

                </div>
                <div class="form-group">
                    <label>작업 유형</label>
                    <input type="text" id="review3Type" placeholder="커버업 작업">

                <div class="form-group">

                </div>
                <div class="form-group">

                </div>

            <div class="review-item">
                <h3>후기 6</h3>
                <div class="form-group">

                    <input type="text" id="review5Name" placeholder="강** 님">

                <div class="form-group">
                    <label>작업 유형</label>
                    <input type="text" id="review5Type" placeholder="팔뚝 타투">
                </div>

            </div>

    <script>
        let siteData = {
            originalHTML: '',
            sha: '',
            portfolioImages: [],
            designImages: []
        };
        
        // 탭 전환
        function switchTab(event, tabName) {
            event.preventDefault();
            
            const tabs = document.querySelectorAll('.tab');
            const contents = document.querySelectorAll('.tab-content');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            contents.forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }
        
        // GitHub 설정 저장
        function saveConfig(event) {
            event.preventDefault();
            
            const config = {
                username: document.getElementById('githubUsername').value.trim(),
                repo: document.getElementById('githubRepo').value.trim(),
                token: document.getElementById('githubToken').value.trim()
            };
            
            if (!config.username || !config.repo || !config.token) {
                showStatus('모든 필드를 입력해주세요.', 'error');
                return;
            }
            
            localStorage.setItem('githubConfig', JSON.stringify(config));
            showStatus('✅ GitHub 설정이 저장되었습니다!', 'success');
        }
        
        // 드래그 앤 드롭 설정
        function setupDropZone(dropZoneId, inputId, previewId, type) {
            const dropZone = document.getElementById(dropZoneId);
            const input = document.getElementById(inputId);
            const preview = document.getElementById(previewId);
            
            dropZone.addEventListener('click', () => input.click());
            
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
            
            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragover');
            });
            
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                handleFiles(e.dataTransfer.files, type, preview);
            });
            
            input.addEventListener('change', (e) => {
                handleFiles(e.target.files, type, preview);
            });
        }
        
        function handleFiles(files, type, preview) {
            Array.from(files).forEach(file => {
                if (!file.type.startsWith('image/')) return;
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('div');
                    img.className = 'preview-item';
                    img.innerHTML = `
                        <img src="${e.target.result}" alt="Preview">
                        <button class="delete-btn" onclick="removePreview(this, '${type}')">×</button>
                    `;
                    preview.appendChild(img);
                    
                    if (type === 'portfolio') {
                        siteData.portfolioImages.push({ name: file.name, data: e.target.result });
                    } else {
                        siteData.designImages.push({ name: file.name, data: e.target.result });
                    }
                };
                reader.readAsDataURL(file);
            });
        }
        
        function removePreview(btn, type) {
            btn.parentElement.remove();
        }
        
        // 이미지 업로드 (GitHub)
        async function uploadImages() {
            const config = getConfig();
            if (!config) return;
            
            showStatus('📤 이미지 업로드 중...', 'info');
            
            try {
                // 포트폴리오 이미지 업로드
                for (const img of siteData.portfolioImages) {
                    const base64 = img.data.split(',')[1];
                    await fetch(
                        `https://api.github.com/repos/${config.username}/${config.repo}/contents/images/portfolio/${img.name}`,
                        {
                            method: 'PUT',
                            headers: {
                                'Authorization': `token ${config.token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                message: `Add portfolio image: ${img.name}`,
                                content: base64
                            })
                        }
                    );
                }
                
                // 도안 이미지 업로드
                for (const img of siteData.designImages) {
                    const base64 = img.data.split(',')[1];
                    await fetch(
                        `https://api.github.com/repos/${config.username}/${config.repo}/contents/images/designs/${img.name}`,
                        {
                            method: 'PUT',
                            headers: {
                                'Authorization': `token ${config.token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                message: `Add design image: ${img.name}`,
                                content: base64
                            })
                        }
                    );
                }
                
                showStatus('✅ 이미지가 업로드되었습니다!', 'success');
            } catch (error) {
                showStatus(`❌ 업로드 오류: ${error.message}`, 'error');
            }
        }
        
        // 사이트 데이터 불러오기
        async function loadSiteData() {
            const config = getConfig();
            if (!config) return;
            
            showStatus('📥 사이트 데이터를 불러오는 중...', 'info');
            
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${config.username}/${config.repo}/contents/index.html`,
                    {
                        headers: {
                            'Authorization': `token ${config.token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    }
                );
                
                if (!response.ok) {
                    throw new Error(`GitHub API 오류: ${response.status}`);
                }
                
                const data = await response.json();
                siteData.sha = data.sha;
                siteData.originalHTML = decodeURIComponent(escape(atob(data.content)));
                
                // 데이터 추출
                extractData(siteData.originalHTML);
                
                showStatus('✅ 사이트 데이터를 성공적으로 불러왔습니다!', 'success');
            } catch (error) {
                console.error('Error:', error);
                showStatus(`❌ 오류: ${error.message}`, 'error');
            }
        }
        
        // 데이터 추출 (실제 HTML 구조에 맞춤)
        function extractData(html) {
            // 연락처 추출
            const phoneMatch = html.match(/010-\d{4}-\d{4}/);
            if (phoneMatch) {
                document.getElementById('phone').value = phoneMatch[0];
                document.getElementById('currentPhone').textContent = phoneMatch[0];
            }
            
            const kakaoMatch = html.match(/ID:\s*making\d+/);
            if (kakaoMatch) {
                const kakaoId = kakaoMatch[0].replace('ID:', '').trim();
                document.getElementById('kakaoId').value = kakaoId;
                document.getElementById('currentKakao').textContent = kakaoId;
            }
            
            const instagramMatch = html.match(/@tattoo_making/);
            if (instagramMatch) {
                document.getElementById('instagramId').value = 'tattoo_making';
                document.getElementById('currentInstagram').textContent = '@tattoo_making';
            }
            
            const linktreeMatch = html.match(/linktr\.ee\/tattoo_making/);
            if (linktreeMatch) {
                document.getElementById('linktreeUrl').value = linktreeMatch[0];
                document.getElementById('currentLinktree').textContent = linktreeMatch[0];
            }
            
            // 가격 추출
            const priceMatches = [];
            const pricePattern = /<div class="pricing-card[^>]*>[\s\S]*?<h3>(.*?)<\/h3>[\s\S]*?<p class="pricing-size">(.*?)<\/p>[\s\S]*?<span class="price-amount">(.*?)<\/span>/g;
            let match;
            while ((match = pricePattern.exec(html)) !== null) {
                priceMatches.push({ title: match[1], size: match[2], amount: match[3] });
            }
            
            if (priceMatches.length >= 4) {
                for (let i = 0; i < 4; i++) {
                    document.getElementById(`price${i+1}Size`).value = priceMatches[i].size;
                    document.getElementById(`price${i+1}Amount`).value = priceMatches[i].amount;
                }
            }
            
            // 후기 추출 - 여러 줄 텍스트 처리
            const reviewCards = html.match(/<div class="review-card">[\s\S]*?<\/div>\s*<\/div>\s*<\/div>/g);
            
            if (reviewCards && reviewCards.length >= 6) {
                reviewCards.forEach((card, idx) => {
                    if (idx < 6) {
                        // 후기 텍스트 추출 (따옴표 포함, 여러 줄)
                        const textMatch = card.match(/<p class="review-text">\s*([\s\S]*?)\s*<\/p>/);
                        const nameMatch = card.match(/<p class="author-name">(.*?)<\/p>/);
                        const typeMatch = card.match(/<p class="review-type">(.*?)<\/p>/);
                        
                        if (textMatch && nameMatch && typeMatch) {
                            // 텍스트 정리: 따옴표 제거, 공백 정리
                            let text = textMatch[1]
                                .replace(/"/g, '')
                                .replace(/\s+/g, ' ')
                                .trim();
                            
                            document.getElementById(`review${idx}Name`).value = nameMatch[1].trim();
                            document.getElementById(`review${idx}Type`).value = typeMatch[1].trim();
                            document.getElementById(`review${idx}Text`).value = text;
                            
                            console.log(`후기 ${idx+1}:`, {
                                name: nameMatch[1].trim(),
                                type: typeMatch[1].trim(),
                                text: text.substring(0, 50) + '...'
                            });
                        }
                    }
                });
            }
        }
        
        // 저장 및 배포
        async function deployAll() {
            const config = getConfig();
            if (!config) return;
            
            if (!siteData.originalHTML || !siteData.sha) {
                showStatus('❌ 먼저 "사이트 데이터 불러오기"를 클릭하세요!', 'error');
                return;
            }
            
            if (!confirm('변경사항을 저장하고 사이트에 배포하시겠습니까?')) {
                return;
            }
            
            showStatus('🚀 배포 중...', 'info');
            
            try {
                let html = siteData.originalHTML;
                
                // 전화번호 업데이트
                const phone = document.getElementById('phone').value;
                if (phone) {
                    html = html.replace(/010-\d{4}-\d{4}/g, phone);
                }
                
                // 카카오톡 ID 업데이트
                const kakaoId = document.getElementById('kakaoId').value;
                if (kakaoId) {
                    html = html.replace(/(ID:\s*)making\d+/g, `$1${kakaoId}`);
                }
                
                // 인스타그램 업데이트
                const instagramId = document.getElementById('instagramId').value;
                if (instagramId) {
                    html = html.replace(/@tattoo_making/g, `@${instagramId}`);
                    html = html.replace(/instagram\.com\/tattoo_making/g, `instagram.com/${instagramId}`);
                }
                
                // Linktree 업데이트
                const linktreeUrl = document.getElementById('linktreeUrl').value;
                if (linktreeUrl) {
                    html = html.replace(/linktr\.ee\/tattoo_making/g, linktreeUrl);
                }
                
                // 가격 업데이트 (각 카드 순차적으로)
                const prices = [];
                for (let i = 1; i <= 4; i++) {
                    prices.push({
                        size: document.getElementById(`price${i}Size`).value,
                        amount: document.getElementById(`price${i}Amount`).value
                    });
                }
                
                let priceIndex = 0;
                html = html.replace(
                    /<p class="pricing-size">(.*?)<\/p>([\s\S]*?)<span class="price-amount">(.*?)<\/span>/g,
                    (match, oldSize, middle, oldAmount) => {
                        if (priceIndex < prices.length && prices[priceIndex].size && prices[priceIndex].amount) {
                            const result = `<p class="pricing-size">${prices[priceIndex].size}</p>${middle}<span class="price-amount">${prices[priceIndex].amount}</span>`;
                            priceIndex++;
                            return result;
                        }
                        priceIndex++;
                        return match;
                    }
                );
                
                // 후기 업데이트 (각 카드 순차적으로)
                const reviews = [];
                for (let i = 0; i < 6; i++) {
                    reviews.push({
                        name: document.getElementById(`review${i}Name`).value,
                        type: document.getElementById(`review${i}Type`).value,
                        text: document.getElementById(`review${i}Text`).value
                    });
                }
                
                let reviewIndex = 0;
                html = html.replace(
                    /<p class="review-text">\s*[\s\S]*?\s*<\/p>([\s\S]*?)<p class="author-name">[\s\S]*?<\/p>([\s\S]*?)<p class="review-type">[\s\S]*?<\/p>/g,
                    (match, middle1, middle2) => {
                        if (reviewIndex < reviews.length && reviews[reviewIndex].name && reviews[reviewIndex].type && reviews[reviewIndex].text) {
                            const result = `<p class="review-text">
                        "${reviews[reviewIndex].text}"
                    </p>${middle1}<p class="author-name">${reviews[reviewIndex].name}</p>${middle2}<p class="review-type">${reviews[reviewIndex].type}</p>`;
                            reviewIndex++;
                            return result;
                        }
                        reviewIndex++;
                        return match;
                    }
                );
                
                // UTF-8 안전 인코딩
                const encodedContent = btoa(unescape(encodeURIComponent(html)));
                
                // GitHub에 커밋
                const response = await fetch(
                    `https://api.github.com/repos/${config.username}/${config.repo}/contents/index.html`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${config.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: '[CMS] 콘텐츠 업데이트',
                            content: encodedContent,
                            sha: siteData.sha
                        })
                    }
                );
                
                if (!response.ok) {
                    throw new Error(`배포 실패: ${response.status}`);
                }
                
                const result = await response.json();
                siteData.sha = result.content.sha;
                
                showStatus('✅ 성공적으로 배포되었습니다! 1-2분 후 사이트에서 확인하세요.', 'success');
            } catch (error) {
                console.error('Error:', error);
                showStatus(`❌ 배포 오류: ${error.message}`, 'error');
            }
        }
        
        // 유틸리티 함수
        function getConfig() {
            const configStr = localStorage.getItem('githubConfig');
            if (!configStr) {
                showStatus('❌ GitHub 설정을 먼저 저장해주세요!', 'error');
                return null;
            }
            return JSON.parse(configStr);
        }
        
        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            
            if (type !== 'info') {
                setTimeout(() => {
                    statusEl.className = 'status';
                }, 5000);
            }
        }
        
        // 페이지 로드 시 초기화
        window.addEventListener('load', function() {
            const config = JSON.parse(localStorage.getItem('githubConfig') || '{}');
            if (config.username) document.getElementById('githubUsername').value = config.username;
            if (config.repo) document.getElementById('githubRepo').value = config.repo;
            if (config.token) document.getElementById('githubToken').value = config.token;
            
            // 드래그 앤 드롭 설정
            setupDropZone('portfolioDropZone', 'portfolioInput', 'portfolioPreview', 'portfolio');
            setupDropZone('designsDropZone', 'designsInput', 'designsPreview', 'designs');
        });
    </script>
</body>
