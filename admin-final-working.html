<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TATTOO MAKING CMS - 최종 완성</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #fff;
            line-height: 1.6;
        }
        .header {
            background: rgba(10, 10, 10, 0.95);
            padding: 1.5rem 2rem;
            border-bottom: 2px solid #c9a45c;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header h1 { font-size: 1.8rem; color: #c9a45c; letter-spacing: 3px; }
        .header p { color: #999; font-size: 0.9rem; margin-top: 0.3rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            background: rgba(18, 18, 18, 0.8);
            padding: 1rem;
            border-radius: 8px;
        }
        .tab {
            padding: 0.8rem 1.5rem;
            background: rgba(42, 42, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
            font-weight: 500;
        }
        .tab:hover { background: rgba(201, 164, 92, 0.2); border-color: #c9a45c; }
        .tab.active { background: #c9a45c; color: #000; }
        .tab-content { display: none; background: rgba(18, 18, 18, 0.9); padding: 2rem; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #c9a45c; font-weight: 500; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            background: rgba(42, 42, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 5px;
            font-family: inherit;
            font-size: 0.95rem;
        }
        .form-group textarea { resize: vertical; min-height: 120px; }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #c9a45c;
            background: rgba(42, 42, 42, 1);
        }
        .btn {
            padding: 1rem 2rem;
            background: #c9a45c;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        .btn:hover { background: #a88541; transform: translateY(-2px); box-shadow: 0 4px 16px rgba(201, 164, 92, 0.4); }
        .btn-secondary { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); border-color: #c9a45c; }
        .actions { display: flex; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; }
        .status { padding: 1rem; border-radius: 5px; margin-bottom: 1.5rem; display: none; }
        .status.success { background: rgba(39, 174, 96, 0.2); border: 1px solid #27ae60; color: #27ae60; display: block; }
        .status.error { background: rgba(231, 76, 60, 0.2); border: 1px solid #e74c3c; color: #e74c3c; display: block; }
        .status.info { background: rgba(52, 152, 219, 0.2); border: 1px solid #3498db; color: #3498db; display: block; }
        .review-item, .price-item { background: rgba(42, 42, 42, 0.6); padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem; border: 1px solid rgba(255, 255, 255, 0.1); }
        .review-item h3, .price-item h3 { color: #c9a45c; margin-bottom: 1rem; }
        .helper-text { font-size: 0.85rem; color: #999; margin-top: 0.3rem; }
        .section-title { font-size: 1.3rem; color: #c9a45c; margin-bottom: 1.5rem; padding-bottom: 0.5rem; border-bottom: 2px solid rgba(201, 164, 92, 0.3); }
        .debug-info { background: rgba(52, 152, 219, 0.1); border: 1px solid #3498db; padding: 1rem; border-radius: 5px; margin-top: 1rem; font-size: 0.85rem; color: #3498db; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🖤 TATTOO MAKING CMS</h1>
        <p>부산 블랙&그레이 리얼리즘 전문 타투샵 - 콘텐츠 관리 시스템</p>
    </div>
    
    <div class="container">

        <div class="tabs">
            <button class="tab active" onclick="switchTab(event, 'setup')">⚙️ GitHub 설정</button>
            <button class="tab" onclick="switchTab(event, 'contact')">📞 연락처</button>

        <!-- GitHub 설정 -->

        <!-- 연락처 -->

            <div class="form-group">

                <input type="tel" id="phone" placeholder="010-2254-0690">
                <p class="helper-text">현재: <span id="currentPhone">-</span></p>

            <div class="form-group">
                <label>카카오톡 ID</label>
                <input type="text" id="kakaoId" placeholder="making91">
                <p class="helper-text">현재: <span id="currentKakao">-</span></p>
            </div>
            <div class="form-group">
                <label>인스타그램 ID</label>
                <input type="text" id="instagramId" placeholder="tattoo_making">
                <p class="helper-text">현재: <span id="currentInstagram">-</span></p>
            </div>
            <div class="form-group">
                <label>Linktree URL</label>
                <input type="url" id="linktreeUrl" placeholder="linktr.ee/tattoo_making">
                <p class="helper-text">현재: <span id="currentLinktree">-</span></p>
            </div>
            <div class="actions">

        </div>
        
        <!-- 가격 -->
        <div id="price" class="tab-content">
            <h2 class="section-title">가격 정보 (4단계)</h2>
            <div class="price-item">
                <h3>1단계: 미니 타투</h3>
                <div class="form-group">

                <div class="form-group">
                    <label>가격</label>

                <div class="form-group">

                    <label>가격</label>

            </div>
            <div class="price-item">

                <div class="form-group">
                    <label>사이즈</label>
                    <input type="text" id="price3Size" placeholder="10-20cm">

            <div class="price-item">

        <!-- 후기 -->
        <div id="review" class="tab-content">
            <h2 class="section-title">고객 후기 (6개)</h2>
            <div class="review-item">
                <h3>후기 1</h3>

            <div class="review-item">
                <h3>후기 4</h3>
                <div class="form-group">
                    <label>고객 이름</label>

                <div class="form-group">

                </div>
                <div class="form-group">
                    <label>후기 내용</label>
                    <textarea id="review4Text"></textarea>
                </div>

            <div class="review-item">
                <h3>후기 6</h3>
                <div class="form-group">
                    <label>고객 이름</label>
                    <input type="text" id="review5Name" placeholder="강** 님">
                </div>
                <div class="form-group">
                    <label>작업 유형</label>
                    <input type="text" id="review5Type" placeholder="팔뚝 타투">

            <div class="actions">
                <button type="button" class="btn" onclick="deployAll()">💾 저장 및 배포</button>
            </div>

    </div>
    
    <script>
        let siteData = { originalHTML: '', sha: '' };
        
        function switchTab(event, tabName) {
            event.preventDefault();
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }
        
        function saveConfig(event) {
            event.preventDefault();
            const config = {
                username: document.getElementById('githubUsername').value.trim(),
                repo: document.getElementById('githubRepo').value.trim(),
                token: document.getElementById('githubToken').value.trim()
            };
            if (!config.username || !config.repo || !config.token) {
                showStatus('모든 필드를 입력해주세요.', 'error');
                return;
            }
            localStorage.setItem('githubConfig', JSON.stringify(config));
            showStatus('✅ GitHub 설정이 저장되었습니다!', 'success');
        }
        
        async function loadSiteData() {
            const config = getConfig();
            if (!config) return;
            
            showStatus('📥 사이트 데이터를 불러오는 중...', 'info');
            const debugEl = document.getElementById('debugInfo');
            debugEl.style.display = 'block';
            debugEl.textContent = '데이터 불러오는 중...\n';
            
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${config.username}/${config.repo}/contents/index.html`,
                    { headers: { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github.v3+json' } }
                );
                
                if (!response.ok) throw new Error(`GitHub API 오류: ${response.status}`);
                
                const data = await response.json();
                siteData.sha = data.sha;
                siteData.originalHTML = decodeURIComponent(escape(atob(data.content)));
                
                debugEl.textContent += '✅ HTML 다운로드 완료\n';
                debugEl.textContent += `파일 크기: ${siteData.originalHTML.length} 문자\n\n`;
                
                extractData(siteData.originalHTML);
                
                showStatus('✅ 사이트 데이터를 성공적으로 불러왔습니다!', 'success');
            } catch (error) {
                console.error('Error:', error);
                debugEl.textContent += `❌ 오류: ${error.message}\n`;
                showStatus(`❌ 오류: ${error.message}`, 'error');
            }
        }
        
        function extractData(html) {
            const debugEl = document.getElementById('debugInfo');
            debugEl.textContent += '=== 데이터 추출 시작 ===\n\n';
            
            // 연락처
            const phoneMatch = html.match(/010-\d{4}-\d{4}/);
            if (phoneMatch) {
                document.getElementById('phone').value = phoneMatch[0];
                document.getElementById('currentPhone').textContent = phoneMatch[0];
                debugEl.textContent += `✅ 전화: ${phoneMatch[0]}\n`;
            }
            
            const kakaoMatch = html.match(/ID:\s*making\d+/);
            if (kakaoMatch) {
                const kakaoId = kakaoMatch[0].replace('ID:', '').trim();
                document.getElementById('kakaoId').value = kakaoId;
                document.getElementById('currentKakao').textContent = kakaoId;
                debugEl.textContent += `✅ 카카오: ${kakaoId}\n`;
            }
            
            const instagramMatch = html.match(/@tattoo_making/);
            if (instagramMatch) {
                document.getElementById('instagramId').value = 'tattoo_making';
                document.getElementById('currentInstagram').textContent = '@tattoo_making';
                debugEl.textContent += `✅ 인스타: @tattoo_making\n`;
            }
            
            const linktreeMatch = html.match(/linktr\.ee\/tattoo_making/);
            if (linktreeMatch) {
                document.getElementById('linktreeUrl').value = linktreeMatch[0];
                document.getElementById('currentLinktree').textContent = linktreeMatch[0];
                debugEl.textContent += `✅ Linktree: ${linktreeMatch[0]}\n\n`;
            }
            
            // 가격 추출
            debugEl.textContent += '=== 가격 추출 ===\n';
            const pricePattern = /<div class="pricing-card[^>]*>[\s\S]*?<h3>(.*?)<\/h3>[\s\S]*?<p class="pricing-size">(.*?)<\/p>[\s\S]*?<span class="price-amount">(.*?)<\/span>/g;
            const prices = [];
            let match;
            while ((match = pricePattern.exec(html)) !== null) {
                prices.push({ title: match[1], size: match[2], amount: match[3] });
                debugEl.textContent += `✅ ${match[1]}: ${match[2]} - ${match[3]}\n`;
            }
            
            for (let i = 0; i < Math.min(4, prices.length); i++) {
                document.getElementById(`price${i+1}Size`).value = prices[i].size;
                document.getElementById(`price${i+1}Amount`).value = prices[i].amount;
            }
            
            // 후기 추출 - 정확한 패턴
            debugEl.textContent += '\n=== 후기 추출 ===\n';
            const reviewPattern = /<p class="review-text">\s*([\s\S]*?)\s*<\/p>[\s\S]*?<p class="author-name">(.*?)<\/p>[\s\S]*?<p class="review-type">(.*?)<\/p>/g;
            const reviews = [];
            let reviewMatch;
            let reviewCount = 0;
            
            while ((reviewMatch = reviewPattern.exec(html)) !== null && reviewCount < 6) {
                // 텍스트 정리: 따옴표 제거, 여러 공백을 하나로, 줄바꿈 제거
                let text = reviewMatch[1]
                    .replace(/"/g, '')  // 따옴표 제거
                    .replace(/\n/g, ' ')  // 줄바꿈을 공백으로
                    .replace(/\s+/g, ' ')  // 여러 공백을 하나로
                    .trim();
                
                const name = reviewMatch[2].trim();
                const type = reviewMatch[3].trim();
                
                reviews.push({ text, name, type });
                
                debugEl.textContent += `✅ 후기 ${reviewCount + 1}:\n`;
                debugEl.textContent += `   이름: ${name}\n`;
                debugEl.textContent += `   유형: ${type}\n`;
                debugEl.textContent += `   내용: ${text.substring(0, 50)}...\n\n`;
                
                document.getElementById(`review${reviewCount}Name`).value = name;
                document.getElementById(`review${reviewCount}Type`).value = type;
                document.getElementById(`review${reviewCount}Text`).value = text;
                
                reviewCount++;
            }
            
            debugEl.textContent += `\n총 ${reviewCount}개 후기 추출 완료!\n`;
            
            if (reviewCount === 0) {
                debugEl.textContent += '\n⚠️ 후기를 찾을 수 없습니다. HTML 구조를 확인하세요.\n';
            }
        }
        
        async function deployAll() {
            const config = getConfig();
            if (!config) return;
            
            if (!siteData.originalHTML || !siteData.sha) {
                showStatus('❌ 먼저 "사이트 데이터 불러오기"를 클릭하세요!', 'error');
                return;
            }
            
            if (!confirm('변경사항을 저장하고 사이트에 배포하시겠습니까?')) return;
            
            showStatus('🚀 배포 중...', 'info');
            
            try {
                let html = siteData.originalHTML;
                
                // 전화번호
                const phone = document.getElementById('phone').value;
                if (phone) html = html.replace(/010-\d{4}-\d{4}/g, phone);
                
                // 카카오
                const kakaoId = document.getElementById('kakaoId').value;
                if (kakaoId) html = html.replace(/(ID:\s*)making\d+/g, `$1${kakaoId}`);
                
                // 인스타
                const instagramId = document.getElementById('instagramId').value;
                if (instagramId) {
                    html = html.replace(/@tattoo_making/g, `@${instagramId}`);
                    html = html.replace(/instagram\.com\/tattoo_making/g, `instagram.com/${instagramId}`);
                }
                
                // Linktree
                const linktreeUrl = document.getElementById('linktreeUrl').value;
                if (linktreeUrl) html = html.replace(/linktr\.ee\/tattoo_making/g, linktreeUrl);
                
                // 가격 업데이트
                let priceIndex = 0;
                html = html.replace(
                    /<p class="pricing-size">(.*?)<\/p>([\s\S]*?)<span class="price-amount">(.*?)<\/span>/g,
                    (match, oldSize, middle, oldAmount) => {
                        if (priceIndex < 4) {
                            const newSize = document.getElementById(`price${priceIndex + 1}Size`).value;
                            const newAmount = document.getElementById(`price${priceIndex + 1}Amount`).value;
                            priceIndex++;
                            if (newSize && newAmount) {
                                return `<p class="pricing-size">${newSize}</p>${middle}<span class="price-amount">${newAmount}</span>`;
                            }
                        }
                        return match;
                    }
                );
                
                // 후기 업데이트
                let reviewIndex = 0;
                html = html.replace(
                    /<p class="review-text">\s*[\s\S]*?\s*<\/p>([\s\S]*?)<p class="author-name">[\s\S]*?<\/p>([\s\S]*?)<p class="review-type">[\s\S]*?<\/p>/g,
                    (match, middle1, middle2) => {
                        if (reviewIndex < 6) {
                            const newText = document.getElementById(`review${reviewIndex}Text`).value;
                            const newName = document.getElementById(`review${reviewIndex}Name`).value;
                            const newType = document.getElementById(`review${reviewIndex}Type`).value;
                            reviewIndex++;
                            if (newText && newName && newType) {
                                return `<p class="review-text">
                        "${newText}"
                    </p>${middle1}<p class="author-name">${newName}</p>${middle2}<p class="review-type">${newType}</p>`;
                            }
                        }
                        return match;
                    }
                );
                
                // UTF-8 인코딩
                const encodedContent = btoa(unescape(encodeURIComponent(html)));
                
                // GitHub 커밋
                const response = await fetch(
                    `https://api.github.com/repos/${config.username}/${config.repo}/contents/index.html`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${config.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: '[CMS] 콘텐츠 업데이트',
                            content: encodedContent,
                            sha: siteData.sha
                        })
                    }
                );
                
                if (!response.ok) throw new Error(`배포 실패: ${response.status}`);
                
                const result = await response.json();
                siteData.sha = result.content.sha;
                
                showStatus('✅ 성공적으로 배포되었습니다! 1-2분 후 사이트에서 확인하세요.', 'success');
            } catch (error) {
                console.error('Error:', error);
                showStatus(`❌ 배포 오류: ${error.message}`, 'error');
            }
        }
        
        function getConfig() {
            const configStr = localStorage.getItem('githubConfig');
            if (!configStr) {
                showStatus('❌ GitHub 설정을 먼저 저장해주세요!', 'error');
                return null;
            }
            return JSON.parse(configStr);
        }
        
        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            if (type !== 'info') setTimeout(() => statusEl.className = 'status', 5000);
        }
        
        window.addEventListener('load', function() {
            const config = JSON.parse(localStorage.getItem('githubConfig') || '{}');
            if (config.username) document.getElementById('githubUsername').value = config.username;
            if (config.repo) document.getElementById('githubRepo').value = config.repo;
            if (config.token) document.getElementById('githubToken').value = config.token;
        });
    </script>
</body>
</html>
